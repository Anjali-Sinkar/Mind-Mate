<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset password — MindMate</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page">
    <div class="auth-bg" aria-hidden="true"></div>
    <div class="auth-card float-soft">
        <div class="auth-emoji" aria-hidden="true">🔐</div>
        <h1>Reset your password</h1>
        <p class="muted">Enter your email and we will create a one-time reset code for your account.</p>
        <form id="resetForm" class="auth-form">
            <label class="sr-only" for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Email" required autocomplete="email">
            <button type="submit" class="btn primary btn-wide">Send reset code</button>
        </form>
        <p id="msg" class="form-msg"></p>
        <p class="auth-switch"><a href="/login">Back to sign in</a></p>
    </div>
    <script>
    document.getElementById("resetForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const msg = document.getElementById("msg");
        msg.textContent = "";
        const email = document.getElementById("email").value.trim();
        const res = await fetch("/api/forgot-password", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ email })
        });
        const data = await res.json();
        if (res.ok && data.ok && data.reset_token) {
            window.location.href = `/reset-password?email=${encodeURIComponent(email)}&token=${encodeURIComponent(data.reset_token)}`;
            return;
        }
        msg.textContent = data.error || data.message || "If that email exists, a reset code has been created.";
    });
    </script>
</body>
</html>
