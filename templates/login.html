<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in — MindMate</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page">
    <div class="auth-bg" aria-hidden="true"></div>
    <div class="auth-card float-soft">
        <div class="auth-emoji" aria-hidden="true">🌿</div>
        <h1>Welcome back</h1>
        <p class="muted">A calm space for you. Sign in to continue.</p>
        <form id="loginForm" class="auth-form">
            <label class="sr-only" for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Email" required autocomplete="username">
            <label class="sr-only" for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Password" required autocomplete="current-password">
            <button type="submit" class="btn primary btn-wide pulse-glow">Sign in</button>
        </form>
        <p id="msg" class="form-msg"></p>
        <p class="auth-switch">No account? <a href="{{ url_for('signup_page') }}">Create one</a></p>
        <p class="tiny muted"><a href="{{ url_for('forgot_password_page') }}">Forgot password?</a></p>
        <p class="tiny muted"><a href="{{ url_for('help_page') }}">India helplines &amp; crisis</a></p>
    </div>
    <script>
    const params = new URLSearchParams(window.location.search);
    const nextUrl = params.get("next") || "/";
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const msg = document.getElementById("msg");
        msg.textContent = "";
        const res = await fetch("/api/login", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                email: document.getElementById("email").value.trim(),
                password: document.getElementById("password").value
            })
        });
        const data = await res.json();
        if (!res.ok) {
            msg.textContent = data.error || "Could not sign in.";
            return;
        }
        window.location.href = nextUrl;
    });
    </script>
</body>
</html>
