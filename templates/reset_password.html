<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set new password — MindMate</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page">
    <div class="auth-bg" aria-hidden="true"></div>
    <div class="auth-card float-soft">
        <div class="auth-emoji" aria-hidden="true">🔑</div>
        <h1>Set a new password</h1>
        <p class="muted">Enter the reset code from the previous step and choose a new password.</p>
        <form id="resetForm" class="auth-form">
            <label class="sr-only" for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Email" required autocomplete="email">
            <label class="sr-only" for="token">Reset code</label>
            <input type="text" id="token" name="token" placeholder="Reset code" required>
            <label class="sr-only" for="password">New password</label>
            <input type="password" id="password" name="password" placeholder="New password" required autocomplete="new-password">
            <label class="sr-only" for="confirm_password">Confirm password</label>
            <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm password" required autocomplete="new-password">
            <button type="submit" class="btn primary btn-wide">Save new password</button>
        </form>
        <p id="msg" class="form-msg"></p>
        <p class="auth-switch"><a href="/login">Back to sign in</a></p>
    </div>
    <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token") || "";
    if (token) document.getElementById("token").value = token;

    document.getElementById("resetForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const msg = document.getElementById("msg");
        msg.textContent = "";
        const res = await fetch("/api/reset-password", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                email: document.getElementById("email").value.trim(),
                token: document.getElementById("token").value.trim(),
                password: document.getElementById("password").value,
                confirm_password: document.getElementById("confirm_password").value
            })
        });
        const data = await res.json();
        msg.textContent = data.error || data.message || "Done.";
    });
    </script>
</body>
</html>
